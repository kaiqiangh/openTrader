services:
  postgres_timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: ot_postgres_timescaledb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_trader}
      POSTGRES_USER: ${POSTGRES_USER:-open_trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-open_trader} -d ${POSTGRES_DB:-open_trader}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: ot_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ot_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  notification_worker:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    container_name: ot_notification_worker
    working_dir: /app
    command:
      - sh
      - -lc
      - uv sync --all-groups && uv run python -m services.notification_service.worker
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-true}
      NOTIFY_DEFAULT_GATEWAY: ${NOTIFY_DEFAULT_GATEWAY:-telegram}
      NOTIFY_QUEUE_NAME: ${NOTIFY_QUEUE_NAME:-notify.events.raw}
      NOTIFY_CONSUMER_BACKEND: ${NOTIFY_CONSUMER_BACKEND:-rabbitmq_http}
      NOTIFY_RABBITMQ_HTTP_API_URL: ${NOTIFY_RABBITMQ_HTTP_API_URL:-http://rabbitmq:15672/api}
      NOTIFY_POLL_TIMEOUT_SECONDS: ${NOTIFY_POLL_TIMEOUT_SECONDS:-1.0}
      NOTIFY_IDLE_SLEEP_SECONDS: ${NOTIFY_IDLE_SLEEP_SECONDS:-0.5}
      NOTIFY_OBSERVABILITY_MAX_RECORDS: ${NOTIFY_OBSERVABILITY_MAX_RECORDS:-200}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - public

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ot_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./config/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      alertmanager:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ot_alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./config/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped
    networks:
      - internal

  loki:
    image: grafana/loki:3.1.1
    container_name: ot_loki
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./config/observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - internal

  tempo:
    image: grafana/tempo:2.6.1
    container_name: ot_tempo
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./config/observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ot_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/observability/grafana/dashboard-definitions:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal
      - public

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  tempo_data:
  grafana_data:

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

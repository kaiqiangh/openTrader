    working_dir: /app
    command:
      - uv
      - run
      - --frozen
      - python
      - -m
      - services.workers.main
      - --worker
      - news
    volumes:
      - ./:/app
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-open_trader}:${POSTGRES_PASSWORD:-change_me}@postgres_timescaledb:5432/${POSTGRES_DB:-open_trader}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres_timescaledb}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-open_trader}
      POSTGRES_USER: ${POSTGRES_USER:-open_trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      RUNTIME_BROKER_BACKEND: ${RUNTIME_BROKER_BACKEND:-rabbitmq_http}
      RUNTIME_RABBITMQ_HTTP_API_URL: ${RUNTIME_RABBITMQ_HTTP_API_URL:-http://rabbitmq:15672/api}
      RUNTIME_BROKER_HTTP_TIMEOUT_SECONDS: ${RUNTIME_BROKER_HTTP_TIMEOUT_SECONDS:-2.0}
      RUNTIME_WORKER_POLL_TIMEOUT_SECONDS: ${RUNTIME_WORKER_POLL_TIMEOUT_SECONDS:-0.5}
      RUNTIME_WORKER_IDLE_SLEEP_SECONDS: ${RUNTIME_WORKER_IDLE_SLEEP_SECONDS:-0.5}
      RUNTIME_REQUIRE_DATABASE: ${RUNTIME_REQUIRE_DATABASE:-true}
      NEWS_SOURCE_MODE: ${NEWS_SOURCE_MODE:-real}
      NEWS_RSS_FEEDS: ${NEWS_RSS_FEEDS}
      NEWS_FETCH_TIMEOUT_SECONDS: ${NEWS_FETCH_TIMEOUT_SECONDS:-8.0}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres_timescaledb:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - internal
      - public

  real_execution_go:
    profiles: ["full"]
    image: golang:1.21-alpine
    working_dir: /app/services/real_execution_go
    command:
      - sh
      - -lc
      - /usr/local/go/bin/go run .
    volumes:
      - ./:/app
    environment:
      RUNTIME_RABBITMQ_HTTP_API_URL: ${RUNTIME_RABBITMQ_HTTP_API_URL:-http://rabbitmq:15672/api}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      REAL_EXECUTION_BRIDGE_URL: ${REAL_EXECUTION_BRIDGE_URL:-http://api:8000/internal/execution/dispatch}
      REAL_EXECUTION_BRIDGE_TIMEOUT_MS: ${REAL_EXECUTION_BRIDGE_TIMEOUT_MS:-3000}
      REAL_EXECUTION_BRIDGE_API_KEY: ${REAL_EXECUTION_BRIDGE_API_KEY}
      REAL_EXECUTION_QUEUE_NAME: ${REAL_EXECUTION_QUEUE_NAME:-execution.intent.real}
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - public

  prometheus:
    profiles: ["full"]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./config/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      alertmanager:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal

  alertmanager:
    profiles: ["full"]
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./config/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped
    networks:
      - internal

  loki:
    profiles: ["full"]
    image: grafana/loki:3.1.1
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./config/observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - internal

  tempo:
    profiles: ["full"]
    image: grafana/tempo:2.6.1
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./config/observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped
    networks:
      - internal

  grafana:
    profiles: ["full"]
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/observability/grafana/dashboard-definitions:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal
      - public

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  tempo_data:
  grafana_data:

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

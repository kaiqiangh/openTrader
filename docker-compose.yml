      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-open_trader}:${POSTGRES_PASSWORD:-change_me}@postgres_timescaledb:5432/${POSTGRES_DB:-open_trader}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres_timescaledb}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-open_trader}
      POSTGRES_USER: ${POSTGRES_USER:-open_trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      RUNTIME_BROKER_BACKEND: ${RUNTIME_BROKER_BACKEND:-rabbitmq_http}
      RUNTIME_RABBITMQ_HTTP_API_URL: ${RUNTIME_RABBITMQ_HTTP_API_URL:-http://rabbitmq:15672/api}
      RUNTIME_BROKER_HTTP_TIMEOUT_SECONDS: ${RUNTIME_BROKER_HTTP_TIMEOUT_SECONDS:-2.0}
      RUNTIME_WORKER_POLL_TIMEOUT_SECONDS: ${RUNTIME_WORKER_POLL_TIMEOUT_SECONDS:-0.5}
      RUNTIME_WORKER_IDLE_SLEEP_SECONDS: ${RUNTIME_WORKER_IDLE_SLEEP_SECONDS:-0.5}
      RUNTIME_REQUIRE_DATABASE: ${RUNTIME_REQUIRE_DATABASE:-true}
      LLM_RUNTIME_ENABLED: ${LLM_RUNTIME_ENABLED:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-15.0}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_QUICK_PROVIDER_ORDER: ${LLM_QUICK_PROVIDER_ORDER:-default}
      LLM_DEEP_PROVIDER_ORDER: ${LLM_DEEP_PROVIDER_ORDER:-default}
      AGENT_DECISION_TTL_SECONDS: ${AGENT_DECISION_TTL_SECONDS:-900}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres_timescaledb:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - internal
      - public

  runtime_worker_simulation:

x-python-runtime: &python_runtime
  build:
    context: .
    dockerfile: docker/runtime-python.Dockerfile
  image: opentrader-python-runtime:local

services:
  postgres_timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_trader}
      POSTGRES_USER: ${POSTGRES_USER:-open_trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-open_trader} -d ${POSTGRES_DB:-open_trader}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - public

  redis:
    profiles: ["pilot", "full"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - public

  migrator:
    <<: *python_runtime
    working_dir: /app
    command:
      - uv
      - run
      - --frozen
      - alembic
      - upgrade
      - head
    volumes:
      - ./:/app
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-open_trader}:${POSTGRES_PASSWORD:-change_me}@postgres_timescaledb:5432/${POSTGRES_DB:-open_trader}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres_timescaledb}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-open_trader}
      POSTGRES_USER: ${POSTGRES_USER:-open_trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    depends_on:
      postgres_timescaledb:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  notification_worker:
    profiles: ["pilot", "full"]
    <<: *python_runtime
    working_dir: /app
    command:
      - uv
      - run
      - --frozen
      - python
      - -m
      - services.notification_service.worker
    volumes:
      - ./:/app
    environment:
      PYTHONUNBUFFERED: "1"
      RUNTIME_REQUIRE_DATABASE: ${RUNTIME_REQUIRE_DATABASE:-true}
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-true}
      NOTIFY_DEFAULT_GATEWAY: ${NOTIFY_DEFAULT_GATEWAY:-telegram}
      NOTIFY_QUEUE_NAME: ${NOTIFY_QUEUE_NAME:-notify.events.raw}
      NOTIFY_CONSUMER_BACKEND: ${NOTIFY_CONSUMER_BACKEND:-rabbitmq_http}
      NOTIFY_RABBITMQ_HTTP_API_URL: ${NOTIFY_RABBITMQ_HTTP_API_URL:-http://rabbitmq:15672/api}
      NOTIFY_POLL_TIMEOUT_SECONDS: ${NOTIFY_POLL_TIMEOUT_SECONDS:-1.0}
      NOTIFY_IDLE_SLEEP_SECONDS: ${NOTIFY_IDLE_SLEEP_SECONDS:-0.5}
      NOTIFY_OBSERVABILITY_MAX_RECORDS: ${NOTIFY_OBSERVABILITY_MAX_RECORDS:-200}
      NOTIFY_GATEWAY_TIMEOUT_SECONDS: ${NOTIFY_GATEWAY_TIMEOUT_SECONDS:-10.0}
      NOTIFY_RATE_LIMIT_PER_MIN: ${NOTIFY_RATE_LIMIT_PER_MIN:-30}
      NOTIFY_DEDUPE_WINDOW_SECONDS: ${NOTIFY_DEDUPE_WINDOW_SECONDS:-120}
      NOTIFY_MAX_ATTEMPTS: ${NOTIFY_MAX_ATTEMPTS:-3}
      NOTIFY_BACKOFF_BASE_SECONDS: ${NOTIFY_BACKOFF_BASE_SECONDS:-0.2}
      NOTIFY_BACKOFF_MULTIPLIER: ${NOTIFY_BACKOFF_MULTIPLIER:-2.0}
      NOTIFY_BACKOFF_MAX_SECONDS: ${NOTIFY_BACKOFF_MAX_SECONDS:-2.0}
      NOTIFICATION_DEFAULT_SEVERITY: ${NOTIFICATION_DEFAULT_SEVERITY:-WARNING}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-bot}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-chat}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - public

  api:
    <<: *python_runtime
    working_dir: /app
    command:
      - uv
      - run
      - --frozen
      - python
      - -m
      - uvicorn
      - services.api.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --limit-request-body
      - "10485760"
    volumes:
      - ./:/app
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-open-trader}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      API_READ_ONLY_MODE: ${API_READ_ONLY_MODE:-true}
      API_STRICT_DATABASE_MODE: ${API_STRICT_DATABASE_MODE:-true}
      API_CORS_ALLOWED_ORIGINS: ${API_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-open_trader}:${POSTGRES_PASSWORD:-change_me}@postgres_timescaledb:5432/${POSTGRES_DB:-open_trader}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres_timescaledb}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-open_trader}
      POSTGRES_USER: ${POSTGRES_USER:-open_trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RUNTIME_RABBITMQ_HTTP_API_URL: ${RUNTIME_RABBITMQ_HTTP_API_URL:-http://rabbitmq:15672/api}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_ISSUER: ${JWT_ISSUER:-open-trader}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-open-trader-api}
      REAL_EXECUTION_BRIDGE_API_KEY: ${REAL_EXECUTION_BRIDGE_API_KEY}
      EXECUTION_MODE_DEFAULT: ${EXECUTION_MODE_DEFAULT:-MOCK}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BITGET_API_KEY: ${BITGET_API_KEY:-}
      BITGET_API_SECRET: ${BITGET_API_SECRET:-}
      BITGET_API_PASSPHRASE: ${BITGET_API_PASSPHRASE:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres_timescaledb:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health/liveness'', timeout=2).read()"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    networks:
      - internal
      - public

  web_dashboard:
    build:
      context: .
      dockerfile: docker/dashboard-next.Dockerfile
    image: opentrader-dashboard-web:local
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - public

  runtime_worker_market:
    <<: *python_runtime
    working_dir: /app
    command:
      - uv
      - run
      - --frozen
      - python
      - -m
      - services.workers.main
      - --worker
      - market
      - --bootstrap-topology
    volumes:
      - ./:/app
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-open_trader}:${POSTGRES_PASSWORD:-change_me}@postgres_timescaledb:5432/${POSTGRES_DB:-open_trader}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres_timescaledb}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-open_trader}
      POSTGRES_USER: ${POSTGRES_USER:-open_trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      RUNTIME_BROKER_BACKEND: ${RUNTIME_BROKER_BACKEND:-rabbitmq_http}
      RUNTIME_RABBITMQ_HTTP_API_URL: ${RUNTIME_RABBITMQ_HTTP_API_URL:-http://rabbitmq:15672/api}
      RUNTIME_BROKER_HTTP_TIMEOUT_SECONDS: ${RUNTIME_BROKER_HTTP_TIMEOUT_SECONDS:-2.0}
      RUNTIME_WORKER_POLL_TIMEOUT_SECONDS: ${RUNTIME_WORKER_POLL_TIMEOUT_SECONDS:-0.5}
      RUNTIME_WORKER_IDLE_SLEEP_SECONDS: ${RUNTIME_WORKER_IDLE_SLEEP_SECONDS:-0.5}
      RUNTIME_REQUIRE_DATABASE: ${RUNTIME_REQUIRE_DATABASE:-true}
      EXCHANGE_DEFAULT: ${EXCHANGE_DEFAULT:-binance}
      MARKET_EXCHANGES: ${MARKET_EXCHANGES:-binance,bitget}
      MARKET_SYMBOLS: ${MARKET_SYMBOLS:-BTC/USDT}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-https://api.binance.com}
      BINANCE_WS_URL: ${BINANCE_WS_URL:-wss://stream.binance.com:9443/ws}
      BITGET_BASE_URL: ${BITGET_BASE_URL:-https://api.bitget.com}
      BITGET_WS_URL: ${BITGET_WS_URL:-wss://ws.bitget.com/v2/ws/public}
      MARKET_DATA_FETCH_MODE: ${MARKET_DATA_FETCH_MODE:-rest}
      MARKET_DATA_REST_POLL_SECONDS: ${MARKET_DATA_REST_POLL_SECONDS:-300}
      MARKET_DATA_HTTP_TIMEOUT_SECONDS: ${MARKET_DATA_HTTP_TIMEOUT_SECONDS:-10.0}
      ORDERBOOK_SNAPSHOT_INTERVAL_SECONDS: ${ORDERBOOK_SNAPSHOT_INTERVAL_SECONDS:-180}
      KLINE_INTERVALS: ${KLINE_INTERVALS:-1m}
      KLINE_POLL_INTERVAL_SECONDS: ${KLINE_POLL_INTERVAL_SECONDS:-60}
      KLINE_FETCH_LIMIT: ${KLINE_FETCH_LIMIT:-200}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres_timescaledb:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - internal
      - public

  runtime_worker_orchestrator:
    <<: *python_runtime
    working_dir: /app
    command:
      - uv
      - run
      - --frozen
      - python
      - -m
      - services.workers.main
      - --worker
      - orchestrator
      - --bootstrap-topology
    volumes:
      - ./:/app
    environment:

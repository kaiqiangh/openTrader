services:
  postgres_timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: ot_postgres_timescaledb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_trader}
      POSTGRES_USER: ${POSTGRES_USER:-open_trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-open_trader} -d ${POSTGRES_DB:-open_trader}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: ot_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ot_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  notification_worker:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    container_name: ot_notification_worker
    working_dir: /app
    command:
      - sh
      - -lc
      - uv sync --all-groups && uv run python -m services.notification_service.worker
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-true}
      NOTIFY_DEFAULT_GATEWAY: ${NOTIFY_DEFAULT_GATEWAY:-telegram}
      NOTIFY_QUEUE_NAME: ${NOTIFY_QUEUE_NAME:-notify.events.raw}
      NOTIFY_CONSUMER_BACKEND: ${NOTIFY_CONSUMER_BACKEND:-rabbitmq_http}
      NOTIFY_RABBITMQ_HTTP_API_URL: ${NOTIFY_RABBITMQ_HTTP_API_URL:-http://rabbitmq:15672/api}
      NOTIFY_POLL_TIMEOUT_SECONDS: ${NOTIFY_POLL_TIMEOUT_SECONDS:-1.0}
      NOTIFY_IDLE_SLEEP_SECONDS: ${NOTIFY_IDLE_SLEEP_SECONDS:-0.5}
      NOTIFY_OBSERVABILITY_MAX_RECORDS: ${NOTIFY_OBSERVABILITY_MAX_RECORDS:-200}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    profiles:
      - app
      - notification

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  internal:
    driver: bridge

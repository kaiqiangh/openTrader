      POSTGRES_HOST: ${POSTGRES_HOST:-postgres_timescaledb}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-open_trader}
      POSTGRES_USER: ${POSTGRES_USER:-open_trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      RUNTIME_BROKER_BACKEND: ${RUNTIME_BROKER_BACKEND:-rabbitmq_http}
      RUNTIME_RABBITMQ_HTTP_API_URL: ${RUNTIME_RABBITMQ_HTTP_API_URL:-http://rabbitmq:15672/api}
      RUNTIME_BROKER_HTTP_TIMEOUT_SECONDS: ${RUNTIME_BROKER_HTTP_TIMEOUT_SECONDS:-2.0}
      RUNTIME_WORKER_POLL_TIMEOUT_SECONDS: ${RUNTIME_WORKER_POLL_TIMEOUT_SECONDS:-0.5}
      RUNTIME_WORKER_IDLE_SLEEP_SECONDS: ${RUNTIME_WORKER_IDLE_SLEEP_SECONDS:-0.5}
      RUNTIME_REQUIRE_DATABASE: ${RUNTIME_REQUIRE_DATABASE:-true}
      EXECUTION_MODE_DEFAULT: ${EXECUTION_MODE_DEFAULT:-MOCK}
      SIMULATION_SLIPPAGE_BPS: ${SIMULATION_SLIPPAGE_BPS:-3.0}
      SIMULATION_FEE_BPS: ${SIMULATION_FEE_BPS:-5.0}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres_timescaledb:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - internal

  runtime_worker_oms:

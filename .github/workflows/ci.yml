name: CI

on:
  push:
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Check for leaked secrets in tracked .env files
        run: uv run python scripts/check_env_secrets.py $(git ls-files '.env*' --error-unmatch 2>/dev/null || true)
      - name: Run tests with coverage
        run: uv run pytest --tb=short --cov=services --cov-report=term-missing --cov-fail-under=60
      - name: Check migration scaffold
        run: uv run alembic -c alembic.ini history

  go-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/real_execution_go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Verify module
        run: go test ./...

  docker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose config
        run: docker compose config --quiet

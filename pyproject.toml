[project]
name = "open-trader"
version = "0.1.0"
description = "LLM-based multi-exchange crypto trading platform"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.1",
    "sqlalchemy>=2.0.36",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
